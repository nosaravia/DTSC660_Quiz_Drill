<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DTSC 660 Quiz Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow working column — module list → quiz card → results review */
:root {
  --bg: #f4f6f9; --surface: #ffffff; --fg: #172030; --muted: #5b6577; --line: #dce1e8;
  --accent: #2f5d8a; --accent-soft: #e6eef6; --on-accent: #ffffff;
  --good: #1e7a4c; --good-soft: #e2f2e9; --bad: #b3362d; --bad-soft: #f8e4e2; --warn: #8a5a00; --warn-soft: #fbf0d9;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --surface: #161d27; --fg: #e6ebf2; --muted: #98a3b3; --line: #273242;
  --accent: #82b2e2; --accent-soft: #1b2a3b; --on-accent: #0f141b;
  --good: #5cc48d; --good-soft: #14301f; --bad: #f08a80; --bad-soft: #3a1c1a; --warn: #e6b45a; --warn-soft: #3a2c10;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161d27; --fg: #e6ebf2; --muted: #98a3b3; --line: #273242;
  --accent: #82b2e2; --accent-soft: #1b2a3b; --on-accent: #0f141b;
  --good: #5cc48d; --good-soft: #14301f; --bad: #f08a80; --bad-soft: #3a1c1a; --warn: #e6b45a; --warn-soft: #3a2c10;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: 0.005em; }
h1 { font-size: 1.9rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.link { border: 0; background: none; padding: 6px 0; color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }

/* Header */
header { display: grid; gap: 6px; }
header p { max-width: 62ch; }

/* Module list */
.mods { display: grid; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.mod { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 16px 18px; border-top: 1px solid var(--line); align-items: center; }
.mod:first-child { border-top: 0; }
.mod-main { min-width: 0; display: grid; gap: 2px; }
.mod-title { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.mod-title h2 { font-size: 1.15rem; }
.mod-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-family: var(--mono); font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--fg); font-variant-numeric: tabular-nums; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }

/* Setup panel */
.setup { grid-column: 1 / -1; display: grid; gap: 14px; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 7px 14px; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 0.85rem; font-weight: 600; }

/* Quiz */
.qtop { display: grid; gap: 10px; }
.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .2s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 18px; }
.qtext { font-size: 1.15rem; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .ltr { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-family: var(--mono); font-weight: 500; background: var(--accent-soft); }
.opt .txt { min-width: 0; overflow-wrap: anywhere; padding-top: 2px; }
.opt .txt.code { font-family: var(--mono); font-size: 0.92rem; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .ltr { background: var(--accent); color: var(--on-accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .ltr { background: var(--good); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ltr { background: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; color: var(--fg); }
.feedback { padding: 12px 14px; border-radius: 8px; font-weight: 500; }
.feedback.good { background: var(--good-soft); color: var(--good); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback .note { display: block; font-weight: 400; color: var(--fg); margin-top: 2px; }
.nav { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 0.75rem; padding: 0; font-variant-numeric: tabular-nums; }
.dot.done { background: var(--accent-soft); border-color: var(--accent-soft); }
.dot.cur { border-color: var(--accent); border-width: 2px; }
.dot.r { background: var(--good-soft); border-color: var(--good-soft); color: var(--good); }
.dot.w { background: var(--bad-soft); border-color: var(--bad-soft); color: var(--bad); }
.warnbox { background: var(--warn-soft); color: var(--warn); padding: 12px 14px; border-radius: 8px; display: grid; gap: 10px; }
.keys { font-size: 0.8rem; }
kbd { font-family: var(--mono); font-size: 0.75rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

/* Results */
.score { display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; align-items: center; }
.big { font-family: var(--display); font-size: 3.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.grade { font-family: var(--display); font-size: 1.4rem; font-weight: 600; }
.review { display: grid; gap: 12px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--good); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.rv.miss { border-left-color: var(--bad); }
.rv .q { font-weight: 600; overflow-wrap: anywhere; }
.rv .ans { display: grid; gap: 4px; font-size: 0.95rem; }
.rv .ans span { overflow-wrap: anywhere; }
.yours.bad { color: var(--bad); }
.correct { color: var(--good); }
@media (max-width: 520px) {
  .mod { grid-template-columns: 1fr; }
  .card { padding: 16px; }
  .score { grid-template-columns: 1fr; }
  .big { font-size: 2.8rem; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>

 ["9", "13.5", "729", "3"], "a": 3, "n": ""}, {"q": "SELECT round(2.567, 1); returns:", "o": ["2.6", "2.5", "2.57", "3"], "a": 0, "n": ""}, {"q": "SELECT county, sum(pop) FROM t; fails because:", "o": ["sum can't add populations", "t is a reserved word", "county isn't aggregated and isn't in GROUP BY", "It doesn't fail"], "a": 2, "n": ""}, {"q": "SELECT state, count(*) FROM t WHERE count(*) > 10 GROUP BY state; fails because:", "o": ["count needs a column", "Aggregates aren't allowed in WHERE; use HAVING", "GROUP BY must come first", "It doesn't fail"], "a": 1, "n": ""}, {"q": "SELECT state AS st, count(*) FROM t WHERE st = 'LA' GROUP BY state; fails because:", "o": ["AS isn't allowed with GROUP BY", "count(*) needs an alias", "'LA' needs double quotes", "The alias st doesn't exist yet when WHERE runs"], "a": 3, "n": ""}, {"q": "Total visits per state:", "o": ["SELECT stabr, sum(visits) FROM pls_fy2018_libraries GROUP BY stabr;", "SELECT sum(visits) FROM pls_fy2018_libraries;", "SELECT stabr, visits FROM pls_fy2018_libraries;", "SELECT stabr, count(visits) FROM pls_fy2018_libraries;"], "a": 0, "n": ""}, {"q": "States with more than 100 libraries:", "o": ["WHERE count(*) > 100", "ORDER BY count(*) > 100", "GROUP BY stabr HAVING count(*) > 100", "GROUP BY count(*) > 100"], "a": 2, "n": ""}, {"q": "Average salary per school, counting only teachers hired after 2010:", "o": ["GROUP BY school HAVING hire_date > '2010-12-31'", "WHERE hire_date > '2010-12-31' GROUP BY school", "ORDER BY hire_date", "GROUP BY hire_date"], "a": 1, "n": "filter rows with WHERE before grouping"}, {"q": "The teachers table has 6 rows across 2 schools. count(DISTINCT school) returns:", "o": ["2", "6", "1", "12"], "a": 0, "n": ""}, {"q": "A table has 10 rows, and 3 have a NULL salary. count(salary) returns:", "o": ["10", "3", "13", "7"], "a": 3, "n": ""}, {"q": "Same table. count(*) returns:", "o": ["7", "10", "3", "0"], "a": 1, "n": ""}, {"q": "avg() of the values 10, 20 and NULL:", "o": ["10", " , "o": ["license_id text CONSTRAINT license_key PRIMARY KEY", "PRIMARY KEY license_id text", "license_id PK", "KEY(license_id)"], "a": 0, "n": ""}, {"q": "Where does a table constraint go?", "o": ["Before CREATE TABLE", "After the column definitions, as its own item", "In INSERT", "In WHERE"], "a": 1, "n": ""}, {"q": "If you don't name a PK constraint:", "o": ["You get an error", "PostgreSQL generates a name such as licenses_pkey", "It stays unnamed forever", "You must run ALTER"], "a": 1, "n": ""}, {"q": "Inserting a duplicate PK value:", "o": ["Succeeds", "Overwrites the existing row", "Raises an error for violating the unique constraint", "Stores NULL"], "a": 2, "n": ""}, {"q": "Inserting NULL into a PK column:", "o": ["Is allowed", "Raises an error", "Is converted to 0", "Generates an auto number"], "a": 1, "n": ""}, {"q": "The SQL-standard auto-incrementing surrogate key:", "o": ["id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY", "id AUTO_INCREMENT", "id IDENTITY(1,1)", "id serial key"], "a": 0, "n": ""}, {"q": "Restart an identity sequence at 5:", "o": ["RESET id 5", "UPDATE sequence", "DROP id", "ALTER TABLE t ALTER COLUMN id RESTART WITH 5"], "a": 3, "n": ""}, {"q": "Inserting your own value into a GENERATED ALWAYS column requires:", "o": ["OVERRIDING SYSTEM VALUE", "Nothing; it's not possible", "CAST", "FORCE"], "a": 0, "n": ""}, {"q": "A UUID is:", "o": ["An integer", "A natural key", "A universally unique identifier, another surrogate key option", "An index"], "a": 2, "n": ""}, {"q": "A foreign key:", "o": ["Is the unique ID of rows in its own table", "Is a column whose values must match a key in another table", "Is an index", "Is a check"], "a": 1, "n": ""}, {"q": "Foreign key syntax:", "o": ["license_id text REFERENCES licenses (license_id)", "FOREIGN license_id", "LINK licenses", "JOIN licenses"], "a": 0, "n": ""}, {"q": "Referential integrity means:", "o": ["Every column is unique", "Data stays sorted", "There are no NULLs", "Child rows can only reference parent rows that exist"], "a": 3, "n": ""}, {"q": "Inserting a registration whose license_id isn't in licenses:", "o": ["Succeeds", "Raises an error", "Creates the parent row", "Stores NULL"], "a": 1, "n": ""}, {"q": "A foreign key can reference:", "o": ["Any column", "A primary key or UNIQUE column", "Only text columns", "Only serial columns"], "a": 1, "n": ""}, {"q": "Deleting a parent row that has child rows, without CASCADE:", "o": ["Deletes both", "Sets the child values to NULL automatically", "Raises an error", "Succeeds silently"], "a": 2, "n": ""}, {"q": "ON DELETE CASCADE:", "o": ["Deletes related child rows automatically when the parent is deleted", "Prevents deletes", "Sets child values to NULL", "Copies rows"], "a": 0, "n": ""}, {"q": "Where does ON DELETE CASCADE go?", "o": ["On the parent's PK", "On the foreign key column in the child table", "In the DELETE statement", "On an index"], "a": 1, "n": ""}, {"q": "The main risk of CASCADE:", "o": ["There is none", "Deleting many related rows by accident", "Slower SELECTs", "Duplicate keys"], "a": 1, "n": ""}, {"q": "When is CASCADE a good choice?", "o": ["Always", "Never", "For lookup data you want to keep", "When child rows have no meaning without the parent"], "a": 3, "n": ""}, {"q": "A CHECK constraint:", "o": ["Tests values against a logical condition", "Enforces uniqueness", "Is a foreign key", "Is an index"], "a": 0, "n": ""}, {"q": "Valid CHECK syntax:", "o": ["CHECK salary", "VALIDATE salary", "CHECK (salary >= 0)", "salary CHECKS 0"], "a": 2, "n": ""}, {"q": "Limit a column to a list of values:", "o": ["CHECK (user_role IN ('Admin','Staff'))", "CHECK user_role = list", "Only with ENUM", "IN CHECK"], "a": 0, "n": ""}, {"q": "A CHECK that compares two columns:", "o": ["Isn't possible", "Is a table constraint, such as CHECK (sale_price < retail_price)", "Must be a column constraint", "Requires an FK"], "a": 1, "n": ""}, {"q": "Inserting a value that violates a CHECK:", "o": ["Raises an error", "Changes the value silently", "Stores NULL", "Only gives a warning"], "a": 0, "n": ""}, {"q": "How does CHECK treat a NULL value?", "o": ["Raises an error", "Passes it, because NULL isn't false", "Converts it", "Locks the table"], "a": 1, "n": ""}, {"q": "UNIQUE:", "o": ["Blocks duplicate values but allows NULLs", "Blocks NULLs", "Is exactly the same as a PK", "Is only an index"], "a": 0, "n": ""}, {"q": "UNIQUE vs. PK:", "o": ["There's no difference", "PK allows NULLs", "UNIQUE allows NULLs, and a table can have many UNIQUE constraints but only one PK", "UNIQUE works only on text"], "a": 2, "n": ""}, {"q": "How many primary keys can a table have?", "o": ["One", "Unlimited", "Two", "Always zero"], "a": 0, "n": ""}, {"q": "NOT NULL:", "o": ["Enforces uniqueness", "Checks a range", "Defaults to 0", "Requires the column to have a value"], "a": 3, "n": ""}, {"q": "NOT NULL syntax:", "o": ["first_name text NOT NULL", "NOT NULL(first_name)", "CHECK NULL", "NULL FALSE"], "a": 0, "n": ""}, {"q": "Remove NOT NULL:", "o": ["DROP CONSTRAINT NOT NULL", "ALTER TABLE t ALTER COLUMN c DROP NOT NULL", "DELETE NOT NULL", "UPDATE"], "a": 1, "n": ""}, {"q": "Add NOT NULL to an existing column:", "o": ["ADD NOT NULL", "INSERT NOT NULL", "ALTER TABLE t ALTER COLUMN c SET NOT NULL", "CHECK NOT NULL"], "a": 2, "n": ""}, {"q": "Remove a named constraint:", "o": ["ALTER TABLE t DROP CONSTRAINT name", "DROP name", "DELETE CONSTRAINT", "REMOVE KEY"], "a": 0, "n": ""}, {"q": "Add a PK to an existing table:", "o": ["UPDATE t SET PRIMARY KEY", "CREATE KEY", "INSERT KEY", "ALTER TABLE t ADD CONSTRAINT k PRIMARY KEY (col)"], "a": 3, "n": ""}, {"q": "Adding a constraint that existing data already violates:", "o": ["Fails", "Deletes the bad rows", "Fixes the data", "Ignores the bad rows"], "a": 0, "n": ""}, {"q": "Why constraints matter:", "o": ["Speed only", "They enforce data quality and reduce errors and duplication", "They're cosmetic", "SELECT requires them"], "a": 1, "n": ""}, {"q": "The purpose of an index:", "o": ["Speeding up searches", "Enforcing a CHECK", "Storing backups", "Constraining values"], "a": 0, "n": ""}, {"q": "PostgreSQL's default index type:", "o": ["GiST", "GIN", "B-tree", "Hash"], "a": 2, "n": ""}, {"q": "Which columns are indexed automatically?", "o": ["PK and UNIQUE columns", "FK columns", "All columns", "None"], "a": 0, "n": ""}, {"q": "Are foreign key columns indexed automatically?", "o": ["Yes", "No; consider adding an index yourself", "Only with CASCADE", "Only for text"], "a": 1, "n": ""}, {"q": "Index syntax:", "o": ["CREATE INDEX street_idx ON new_york_addresses (street);", "INDEX street;", "ADD INDEX street;", "CREATE street INDEX;"], "a": 0, "n": ""}, {"q": "Measure a query's performance:", "o": ["TIME", "MEASURE", "SHOW", "EXPLAIN ANALYZE"], "a": 3, "n": ""}, {"q": "A downside of indexes:", "o": ["They use space and slow down inserts and updates", "They have none", "They slow down SELECTs", "They delete data"], "a": 0, "n": ""}, {"q": "PostgreSQL's maximum identifier length:", "o": ["63 characters", "255", "128", "30"], "a": 0, "n": ""}, {"q": "The problem with quoted identifiers such as \"Customers\":", "o": ["They're faster", "They're required", "They become case-sensitive and must always be quoted", "There's no problem"], "a": 2, "n": ""}, {"q": "A table with no primary key:", "o": ["Can't be created", "Is allowed, but not recommended", "Gets one automatically", "Can't hold data"], "a": 1, "n": ""}, {"q": "With a composite key on (student_id, school_day), can student_id repeat?", "o": ["Yes; only the combination must be unique", "No", "Only if school_day is NULL", "Only with CASCADE"], "a": 0, "n": ""}, {"q": "A primary key is effectively:", "o": ["CHECK + DEFAULT", "FOREIGN KEY + INDEX", "UNIQUE + NOT NULL", "NOT NULL only"], "a": 2, "n": ""}, {"q": "Can a foreign key column contain NULL?", "o": ["Never", "It raises an error", "Only with CASCADE", "Yes, unless NOT NULL is also set"], "a": 3, "n": ""}, {"q": "Which table do you create first?", "o": ["The parent (referenced) table", "The child table", "Either order works", "Both at once"], "a": 0, "n": ""}, {"q": "Without CASCADE, which table do you drop first?", "o": ["The parent", "The child (referencing) table", "Either order works", "Both at once"], "a": 1, "n": ""}, {"q": "UNIQUE (first_name, last_name) means:", "o": ["Each column is unique on its own", "No NULLs are allowed", "The combination must be unique", "An index is all it creates"], "a": 2, "n": ""}, {"q": "Can a CHECK constraint look up values in another table?", "o": ["Yes, with a subquery", "Yes, always", "Only for foreign keys", "No; use a foreign key for that"], "a": 3, "n": ""}, {"q": "Does a primary key need its own CREATE INDEX?", "o": ["No; it gets an index automatically", "Yes, always", "Only for text keys", "Only for composite keys"], "a": 0, "n": ""}, {"q": "EXPLAIN ANALYZE shows:", "o": ["Only the query results", "The query plan and actual execution time", "The table's constraints", "Index sizes only"], "a": 1, "n": ""}, {"q": "\"Seq Scan\" in a query plan means PostgreSQL:", "o": ["Used an index", "Sorted the data", "Read the whole table row by row", "Skipped the table"], "a": 2, "n": ""}, {"q": "After adding a useful index, the plan often shows:", "o": ["Index Scan or Bitmap Index Scan", "Seq Scan only", "Cross Join", "Nothing changes"], "a": 0, "n": ""}, {"q": "Identity columns vs. serial:", "o": ["serial is the SQL standard", "Identity columns are the SQL standard; serial is PostgreSQL-specific", "They're identical in every way", "Identity columns are MySQL only"], "a": 1, "n": ""}, {"q": "A column DEFAULT:", "o": ["Is required", "Supplies a value when INSERT leaves the column out", "Enforces uniqueness", "Is a CHECK"], "a": 1, "n": ""}, {"q": "An identifier longer than 63 characters is:", "o": ["An error", "Allowed in full", "Rejected by pgAdmin", "Truncated to 63 characters"], "a": 3, "n": ""}, {"q": "A state-assigned student ID that never changes and is never reused is a candidate for:", "o": ["A surrogate key", "A natural key", "A CHECK constraint", "An index only"], "a": 1, "n": ""}, {"q": "Why is email often a poor primary key?", "o": ["It's too short", "It can't be text", "It's always NULL", "People change emails, so the key would change"], "a": 3, "n": ""}, {"q": "Attendance has one row per student per school day. The best primary key:", "o": ["A composite key on (student_id, school_day)", "student_id alone", "school_day alone", "No key"], "a": 0, "n": ""}, {"q": "CREATE TABLE t (id integer PRIMARY KEY, code text PRIMARY KEY); fails because:", "o": ["text can't be a key", "integer can't be a key", "A table can have only one primary key", "It doesn't fail"], "a": 2, "n": "use one composite key instead"}, {"q": "A foreign key references a column that has no PRIMARY KEY or UNIQUE constraint. Result:", "o": ["Works normally", "Error: no unique constraint matches the referenced key", "The column becomes unique automatically", "A warning only"], "a": 1, "n": ""}, {"q": "Inserting a registration with license_id 'XYZ' when 'XYZ' isn't in licenses:", "o": ["Works", "Adds 'XYZ' to licenses", "Stores NULL", "Raises a foreign key violation error"], "a": 3, "n": ""}, {"q": "With ON DELETE CASCADE, DELETE FROM licenses WHERE license_id = 'A203391'; also:", "o": ["Deletes that license's registrations", "Deletes all registrations", "Raises an error", "Sets registrations to NULL"], "a": 0, "n": ""}, {"q": "Same delete without CASCADE, when registrations exist for that license:", "o": ["Deletes both", "Deletes only the license", "Raises an error, because registrations still reference it", "Deletes only the registrations"], "a": 2, "n": ""}, {"q": "CHECK (user_role IN ('Admin', 'Staff')). Inserting 'admin' (lowercase):", "o": ["Works", "Fails, because the comparison is case-sensitive", "Converts it to 'Admin'", "Stores NULL"], "a": 1, "n": ""}, {"q": "CHECK (salary >= 0). Inserting NULL for salary:", "o": ["Fails", "Stores 0", "Raises a warning", "Succeeds, because NULL doesn't make the check false"], "a": 3, "n": ""}, {"q": "UNIQUE (email). Inserting two rows that both have a NULL email:", "o": ["Both are allowed", "The second fails", "Both fail", "The NULLs become empty strings"], "a": 0, "n": ""}, {"q": "first_name is NOT NULL. INSERT INTO contacts (email) VALUES ('a@b.org');:", "o": ["Works", "Sets first_name to ''", "Fails: null value violates the not-null constraint", "Uses the email as the name"], "a": 2, "n": ""}, {"q": "ALTER TABLE t ADD CONSTRAINT email_unique UNIQUE (email); when duplicates already exist:", "o": ["Removes the duplicates", "Fails", "Works, applying only to new rows", "Keeps the first duplicate only"], "a": 1, "n": ""}, {"q": "Grades must be between 0 and 100:", "o": ["CHECK (grade BETWEEN 0 AND 100)", "UNIQUE (grade)", "grade NOT NULL", "REFERENCES grades"], "a": 0, "n": ""}, {"q": "end_date must come after start_date:", "o": ["Two NOT NULL constraints", "UNIQUE (start_date, end_date)", "A foreign key", "A table CHECK: CHECK (end_date > start_date)"], "a": 3, "n": ""}, {"q": "Every employee must belong to a department that exists:", "o": ["CHECK (dept_id > 0)", "UNIQUE (dept_id)", "A foreign key: dept_id REFERENCES departments (dept_id)", "An index on dept_id"], "a": 2, "n": ""}, {"q": "No two staff may share a badge number, but some staff have no badge yet:", "o": ["PRIMARY KEY (badge_no)", "UNIQUE (badge_no)", "badge_no NOT NULL", "CHECK (badge_no > 0)"], "a": 1, "n": "UNIQUE allows NULLs; a primary key doesn't"}, {"q": "Deleting a bank customer should remove their accounts automatically:", "o": ["accounts.customer_id REFERENCES customers ON DELETE CASCADE", "A CHECK on customers", "UNIQUE on accounts", "An index on customers"], "a": 0, "n": ""}, {"q": "Deleting a department must NOT delete its employees:", "o": ["Add ON DELETE CASCADE", "Remove the foreign key", "Use UNIQUE instead", "Keep the default (no CASCADE), so the delete is blocked while employee aster", "It adds an index"], "a": 0, "n": ""}, {"q": "ALTER TABLE t ALTER COLUMN c SET NOT NULL fails when:", "o": ["The table is empty", "c is text", "Some existing rows already have NULL in c", "c has an index"], "a": 2, "n": ""}]}, {"id": 6, "name": "Module 6", "ch": "Ch. 7 & 13", "topic": "Joins, set operators and subqueries", "qs": [{"q": "A JOIN:", "o": ["Deletes rows", "Stacks query results", "Combines rows from two or more tables based on related columns", "Creates a table"], "a": 2, "n": ""}, {"q": "JOIN with no type keyword means:", "o": ["INNER JOIN", "LEFT JOIN", "FULL JOIN", "CROSS JOIN"], "a": 0, "n": ""}, {"q": "INNER JOIN returns:", "o": ["All rows from both tables", "Only rows with matches in both tables", "All rows from the left table", "Every combination"], "a": 1, "n": ""}, {"q": "LEFT JOIN returns:", "o": ["Only matches", "All rows from the right table", "Every combination", "All rows from the left table plus matches from the right, with NULLs where there's no match"], "a": 3, "n": ""}, {"q": "RIGHT JOIN returns:", "o": ["All rows from the right table plus matches from the left", "Only matches", "All rows from the left table", "Nothing"], "a": 0, "n": ""}, {"q": "FULL OUTER JOIN returns:", "o": ["Only matches", "The left table only", "All rows from both tables, with NULLs where there's no match", "Every combination"], "a": 2, "n": ""}, {"q": "CROSS JOIN:", "o": ["Requires ON", "Returns every combination of rows (a Cartesian product)", "Returns only matches", "Removes duplicates"], "a": 1, "n": ""}, {"q": "CROSS JOIN of a 5-row table and a 4-row table returns:", "o": ["9 rows", "5 rows", "4 rows", "20 rows"], "a": 3, "n": ""}, {"q": "LEFT JOIN vs. LEFT OUTER JOIN:", "o": ["They're the same", "OUTER returns more rows", "OUTER removes NULLs", "LEFT is invalid"], "a": 0, "n": ""}, {"q": "Find rows in the left table that have no match in the right table:", "o": ["INNER JOIN ... WHERE rt.id = NULL", "LEFT JOIN ... WHERE rt.id IS NULL", "CROSS JOIN", "UNION"], "a": 1, "n": ""}, {"q": "Why use IS NULL instead of = NULL?", "o": ["It's faster", "There's no difference", "= NULL is never true", "IS NULL works only with text"], "a": 2, "n": ""}, {"q": "The ON clause:", "o": ["Specifies which columns to match", "Sorts the results", "Filters groups", "Names the table"], "a": 0, "n": ""}, {"q": "JOIN ... USING (id):", "o": ["Causes an error", "Is the same as a CROSS JOIN", "Requires different column names", "Is a shortcut when the column name is the same in both tables, and shows that column once"], "a": 3, "n": ""}, {"q": "An \"ambiguous column\" error is fixed by:", "o": ["Renaming the table", "Qualifying the column with its table name or alias", "Using DISTINCT", "Using UNION"], "a": 1, "n": ""}, {"q": "Table alias syntax:", "o": ["FROM schools_left AS lt", "FROM lt = schools_left", "ALIAS schools_left lt", "FROM schools_left (lt)"], "a": 0, "n": ""}, {"q": "After aliasing schools_left as lt, you refer to its id column as:", "o": ["schools_left:id", "id.lt", "lt.id", "[lt].id"], "a": 2, "n": ""}, {"q": "To join three tables:", "o": ["It's not possible", "Chain another JOIN ... ON", "Use UNION", "Use commas only"], "a": 1, "n": ""}, {"q": "An example of a one-to-many relationship:", "o": ["One person, one passport", "Students and classes", "Two unrelated tables", "One department, many employees"], "a": 3, "n": ""}, {"q": "A many-to-many relationship needs:", "o": ["A junction table", "CROSS JOIN only", "A composite index", "Nothing extra"], "a": 0, "n": ""}, {"q": "One-to-one means:", "o": ["Many matches", "No matches", "Each row matches at most one row in the other table", "Every combination"], "a": 2, "n": ""}, {"q": "Joining a text column to an integer column:", "o": ["Works automatically", "Raises an error unless you cast one side", "Returns NULLs", "Becomes a CROSS JOIN"], "a": 1, "n": ""}, {"q": "Can you join on columns with different names?", "o": ["Yes, for example ON a.emp_dept = b.dept_id", "No", "Only with USING", "Only with CROSS JOIN"], "a": 0, "n": ""}, {"q": "Set operators combine results:", "o": ["Side by side, as columns", "Through a subquery", "Stacked vertically, as rows", "As a pivot"], "a": 2, "n": ""}, {"q": "UNION:", "o": ["Keeps duplicates", "Combines the results and removes duplicates", "Returns only common rows", "Returns rows in the first query only"], "a": 1, "n": ""}, {"q": "UNION ALL:", "o": ["Removes duplicates", "Returns common rows", "Raises an error", "Combines the results and keeps duplicates"], "a": 3, "n": ""}, {"q": "INTERSECT returns:", "o": ["Rows that appear in both queries", "All rows", "Rows in the first query only", "Every combination"], "a": 0, "n": ""}, {"q": "EXCEPT returns:", "o": ["Rows in both queries", "All rows", "Rows in the first query that aren't in the second", "Rows in the second query only"], "a": 2, "n": ""}, {"q": "A requirement for set operators:", "o": ["The same table name", "The same number of columns, with compatible data types", "A primary key", "An ORDER BY in each query"], "a": 1, "n": ""}, {"q": "In a UNION, the result's column names come from:", "o": ["The first query", "The last query", "Alphabetical order", "Nothing; they're unnamed"], "a": 0, "n": ""}, {"q": "ORDER BY in a UNION query:", "o": ["Goes in each query", "Isn't allowed", "Sorts only the first query", "Goes at the end and sorts the combined result"], "a": 3, "n": ""}, {"q": "To show which table each row came from in a UNION:", "o": ["Use a JOIN", "Add a literal column, such as '2020' AS year", "Use DISTINCT", "It's not possible"], "a": 1, "n": ""}, {"q": "Which is faster because it doesn't remove duplicates?", "o": ["UNION", "INTERSECT", "UNION ALL", "EXCEPT"], "a": 2, "n": ""}, {"q": "JOIN vs. set operators:", "o": ["A JOIN adds columns side by side; set operators stack rows", "They're the same", "A JOIN stacks rows", "Set operators need ON"], "a": 0, "n": ""}, {"q": "A subquery is:", "o": ["A view", "A query nested inside another query, in parentheses", "A join type", "An index"], "a": 1, "n": ""}, {"q": "WHERE pop >= (SELECT percentile_cont(.9) ...) works because the subquery:", "o": ["Returns a table", "Returns many rows", "Is correlated", "Returns a single value"], "a": 3, "n": ""}, {"q": "A scalar subquery returns:", "o": ["One value", "Many rows", "A table", "Nothing"], "a": 0, "n": ""}, {"q": "A subquery in FROM (a derived table) must have:", "o": ["ORDER BY", "A primary key", "An alias", "UNION"], "a": 2, "n": ""}, {"q": "A subquery in the SELECT list must return:", "o": ["Many columns", "A single value", "A table", "NULL"], "a": 1, "n": ""}, {"q": "WHERE emp_id IN (SELECT id FROM retirees):", "o": ["Matches any value the subquery returns", "Matches only the first value", "Raises an error", "Is the same as a CROSS JOIN"], "a": 0, "n": ""}, {"q": "NOT IN with a subquery that returns a NULL:", "o": ["Works normally", "Raises an error", "Returns all rows", "Returns no rows"], "a": 3, "n": ""}, {"q": "The safer alternative to NOT IN when NULLs are possible:", "o": ["IN", "NOT EXISTS", "UNION", "CASE"], "a": 1, "n": ""}, {"q": "EXISTS returns true when:", "o": ["The subquery returns NULL", "The tables match exactly", "The subquery returns at least one row", "The subquery returns zero rows"], "a": 2, "n": ""}, {"q": "A correlated subquery:", "o": ["Refers to a column in the outer query and runs once for each row", "Runs once only", "Can't use WHERE", "Is a CTE"], "a": 0, "n": ""}, {"q": "LATERAL:", "o": ["Sorts results", "Removes duplicates", "Creates an index", "Lets a subquery in FROM refer to tables listed earlier in the FROM clause"], "a": 3, "n": ""}, {"q": "Can you use a subquery in DELETE or UPDATE?", "o": ["No", "Yes, for example DELETE FROM t WHERE id IN (SELECT ...)", "Only in UPDATE", "Only with a CTE"], "a": 1, "n": ""}, {"q": "CTE syntax:", "o": ["WITH name AS (SELECT ...) SELECT ... FROM name;", "CTE name = SELECT ...", "CREATE CTE name", "SELECT ... WITH name"], "a": 0, "n": ""}, {"q": "A main advantage of a CTE:", "o": ["It stores data permanently", "It always runs faster", "Readability, and it can be referenced again in the same query", "It replaces indexes"], "a": 2, "n": ""}, {"q": "crosstab() requires:", "o": ["Nothing", "CREATE EXTENSION tablefunc;", "A primary key", "UNION"], "a": 1, "n": ""}, {"q": "crosstab() produces:", "o": ["A join", "A CTE", "An index", "A pivot table, with values turned into columns"], "a": 3, "n": ""}, {"q": "CASE syntax:", "o": ["CASE WHEN cond THEN result ... ELSE result END", "IF cond THEN ... ENDIF", "SWITCH cond", "CASE cond: result"], "a": 0, "n": ""}, {"q": "CASE with no ELSE, when no condition matches, returns:", "o": ["0", "An error", "NULL", "The first THEN value"], "a": 2, "n": ""}, {"q": "When several WHEN conditions are true, CASE returns:", "o": ["The last true one", "The result of the first true condition", "All of them", "An error"], "a": 1, "n": ""}, {"q": "When to use a subquery instead of a join:", "o": ["Always", "Never", "When you need to stack rows", "When you need a computed value or filter from another query rather than columns from both tables"], "a": 3, "n": ""}, {"q": "In the standard University database, which table links students to the sections they took?", "o": ["takes", "teaches", "advisor", "prereq"], "a": 0, "n": "assumes the standard schema"}, {"q": "In an INNER JOIN, rows whose join key is NULL:", "o": ["Match each other", "Never match", "Match everything", "Cause an error"], "a": 1, "n": ""}, {"q": "If the right table has two rows with the same key, an INNER JOIN returns:", "o": ["One row per match, so the left row appears twice", "Only the first match", "An error", "No rows"], "a": 0, "n": ""}, {"q": "A LEFT JOIN where all 5 left rows match exactly one right row returns:", "o": ["0 rows", "10 rows", "5 rows", "25 rows"], "a": 2, "n": ""}, {"q": "FULL OUTER JOIN is useful for:", "o": ["Every combination of rows", "Matching rows only", "Sorting", "Finding unmatched rows on both sides at once"], "a": 3, "n": ""}, {"q": "A self join:", "o": ["Joins a table to itself using two aliases", "Isn't allowed", "Is the same as UNION", "Needs a CTE"], "a": 0, "n": ""}, {"q": "UNION of a text column with an integer column:", "o": ["Works automatically", "Raises an error unless you cast one side", "Returns NULLs", "Becomes a JOIN"], "a": 1, "n": ""}, {"q": "To keep duplicate rows with INTERSECT:", "o": ["INTERSECT ALL", "INTERSECT DISTINCT", "UNION", "It's not possible"], "a": 0, "n": ""}, {"q": "WHERE id = (SELECT id FROM t) when the subquery returns several rows:", "o": ["Matches any of them", "Uses the first row", "Returns NULL", "Raises an error"], "a": 3, "n": "use IN for multiple values"}, {"q": "A derived table vs. a CTE:", "o": ["Only the CTE is stored permanently", "Both are temporary result sets; a CTE is defined up front with WITH", "A derived table needs WITH", "They can't be joined"], "a": 1, "n": ""}, {"q": "Can you GROUP BY a CASE expression?", "o": ["No", "Only in WHERE", "Yes", "Only with HAVING"], "a": 2, "n": ""}, {"q": "In the University database, which table records which instructor teaches which section?", "o": ["takes", "teaches", "advisor", "section"], "a": 1, "n": ""}, {"q": "In the University database, course prerequisites are in:", "o": ["course", "takes", "section", "prereq"], "a": 3, "n": ""}, {"q": "In the University database, the table that links a student to their advisor:", "o": ["advisor", "teaches", "department", "takes"], "a": 0, "n": ""}, {"q": "List every department, including ones with no instructors:", "o": ["department INNER JOIN instructor", "instructor RIGHT JOIN classroom", "department LEFT JOIN instructor", "department CROSS JOIN instructor"], "a": 2, "n": ""}, {"q": "Count instructors per department so empty departments show 0, after department LEFT JOIN instructor:", "o": ["count(*)", "count(instructor.id)", "sum(*)", "count(DISTINCT dept_name)"], "a": 1, "n": "count(*) would count the NULL row as 1"}, {"q": "schools_left has ids 1, 2, 5, 6. schools_right has ids 1, 2, 3, 4, 6. An INNER JOIN on id returns how many rows?", "o": ["4", "3", "5", "9"], "a": 1, "n": "ids 1, 2 and 6 match"}, {"q": "Same tables. LEFT JOIN (schools_left on the left) returns how many rows?", "o": ["3", "5", "4", "6"], "a": 2, "n": ""}, {"q": "Same tables. RIGHT JOIN returns how many rows?", "o": ["5", "4", "3", "9"], "a": 0, "n": ""}, {"q": "Same tables. FULL OUTER JOIN returns how many rows?", "o": ["9", "3", "5", "6"], "a": 3, "n": "ids 1 through 6, each once"}, {"q": "Same tables. CROSS JOIN returns how many rows?", "o": ["9", "20", "6", "3"], "a": 1, "n": "4 × 5"}, {"q": "Same tables. LEFT JOIN ... WHERE rt.id IS NULL returns which id?", "o": ["3", "6", "5", "1"], "a": 2, "n": ""}, {"q": "Same tables. RIGHT JOIN ... WHERE lt.id IS NULL returns which ids?", "o": ["3 and 4", "5", "1 and 2", "6"], "a": 0, "n": ""}, {"q": "SELECT id FROM schools_left JOIN schools_right ON schools_left.id = schools_right.id; fails because:", "o": ["JOIN needs USING", "The tables have no rows", "ON must use aliases", "id is ambiguous; it exists in both tables"], "a": 3, "n": ""}, {"q": "FROM schools_left AS lt JOIN schools_right AS rt ON schools_left.id = rt.id fails because:", "o": ["You can't alias both tables", "Once a table has an alias, you must refer to it by the alias (lt.id)", "AS isn't allowed", "It doesn't fail"], "a": 1, "n": ""}, {"q": "SELECT * FROM schools_left JOIN schools_right; (no ON) fails because:", "o": ["Only CROSS JOIN can omit the join condition", "* isn't allowed with JOIN", "The tables need aliases", "It doesn't fail"], "a": 0, "n": ""}, {"q": "To rewrite a RIGHT JOIN as a LEFT JOIN:", "o": ["Add WHERE IS NULL", "Use FULL JOIN", "Swap the order of the two tables", "It can't be done"], "a": 2, "n": ""}, {"q": "district_2020 has schools A, B, C. district_2035 has B, C, D. UNION returns how many rows?", "o": ["6", "2", "3", "4"], "a": 3, "n": ""}, {"q": "Same tables. UNION ALL returns how many row function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}
function grade(p) { return SCALE.find(([min]) => p >= min)[1]; }
function pctChip(p, label) {
  const cls = p >= 90 ? "good" : p >= 77 ? "warn" : "bad";
  return el("span", { class: "chip " + cls, text: `${label} ${p}%` });
}
const CODE_RE = /^(SELECT|INSERT|CREATE|ALTER|DROP|COPY|WITH|WHERE|ORDER BY|GROUP BY|CAST|LIKE|ILIKE|DELETE|UPDATE|REFERENCES|CHECK \(|CHECK |UNIQUE \(|INTERSECT|UNION|EXCEPT|CASE |IN |NOT NULL|LEFT JOIN|INNER JOIN|department|count|sum|avg|rank|corr|regr_|percentile|mode\(|unnest|factorial|round|stddev|var_|now\(|sqrt|offenses|part \/|\(new|\(old|value|id |license_id|first_name|[a-z_]+\(|'|"|\d|[<>!=|^%\\\/`(-])/;
function isCode(s) { return CODE_RE.test(s) && s.length < 90; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  if (!qIndexes && setup.len !== "all") pool = pool.slice(0, Math.min(setup.len, pool.length));
  quiz = { mod: id, items: pool.map(qi => ({ qi, pick: null })), idx: 0, mode: setup.mode, finished: false, warn: false, retry: !!qIndexes };
  view = "quiz"; render(); window.scrollTo(0, 0);
}
function finish() {
  quiz.finished = true;
  const m = modById(quiz.mod);
  const right = quiz.items.filter(it => it.pick === m.qs[it.qi].a).length;
  const p = Math.round(right / quiz.items.length * 100);
  const s = stats[quiz.mod] || { best: 0, last: null, tries: 0 };
  s.tries += 1; s.last = p; s.best = Math.max(s.best, p);
  stats[quiz.mod] = s; saveStats();
  reviewFilter = right === quiz.items.length ? "all" : "missed";
  view = "results"; render(); window.scrollTo(0, 0);
}

function renderHome() {
  const total = DATA.reduce((n, m) => n + m.qs.length, 0);
  app.append(el("header", {},
    el("div", { class: "eyebrow", text: "Eastern University · DTSC 660 · Practical SQL, 2nd ed." }),
    el("h1", { text: "Reading quiz drill" }),
    el("p", { class: "muted", text: `${total} PostgreSQL questions across the 7 graded quizzes. Pick a module, answer one question at a time, and get your score and a review of every miss at the end.` })
  ));
  const list = el("div", { class: "mods" });
  for (const m of DATA) {
    const s = stats[m.id];
    const statsRow = el("div", { class: "mod-stats" },
      el("span", { class: "chip", text: `${m.qs.length} questions` }),
      s ? pctChip(s.best, "Best") : el("span", { class: "chip", text: "Not tried yet" }),
      s ? pctChip(s.last, "Last") : null,
      s ? el("span", { class: "chip", text: `${s.tries} attempt${s.tries === 1 ? "" : "s"}` }) : null
    );
    const row = el("div", { class: "mod" },
      el("div", { class: "mod-main" },
        el("div", { class: "mod-title" }, el("h2", { text: m.name }), el("span", { class: "eyebrow", text: m.ch })),
        el("p", { class: "muted", text: m.topic }),
        statsRow
      ),
      el("button", { class: openSetup === m.id ? "btn" : "btn primary", "aria-expanded": String(openSetup === m.id),
        onclick: () => { openSetup = openSetup === m.id ? null : m.id; render(); } }, openSetup === m.id ? "Close" : "Start")
    );
    if (openSetup === m.id) row.append(renderSetup(m));
    list.append(row);
  }
  app.append(list);
  app.append(el("p", { class: "muted keys" }, "Scores are saved in this browser only. Quiz order is shuffled each attempt, so retakes feel like a new version."));
}
function seg(options, current, onPick) {
  return el("div", { class: "seg", role: "group" }, options.map(([val, label]) =>
    el("button", { "aria-pressed": String(current === val), onclick: () => onPick(val) }, label)));
}
function renderSetup(m) {
  const lens = [[10, "10"], [20, "20"], [30, "30"], ["all", `All ${m.qs.length}`]];
  return el("div", { class: "setup" },
    el("div", { class: "field" }, el("span", { class: "lbl", text: "How many questions" }),
      seg(lens, setup.len, v => { setup.len = v; render(); })),
    el("div", { class: "field" }, el("span", { class: "lbl", text: "When to see answers" }),
      seg([["exam", "At the end (like the real quiz)"], ["practice", "After each question"]], setup.mode, v => { setup.mode = v; render(); })),
    el("div", { class: "row" }, el("button", { class: "btn primary", onclick: () => startQuiz(m.id) }, `Begin ${m.name} quiz`))
  );
}

function renderQuiz() {
  const m = modById(quiz.mod);
  const it = quiz.items[quiz.idx];
  const q = m.qs[it.qi];
  const n = quiz.items.length;
  const answered = quiz.items.filter(x => x.pick !== null).length;
  const locked = quiz.mode === "practice" && it.pick !== null;

  app.append(el("div", { class: "qtop" },
    el("div", { class: "row spread" },
      el("div", { class: "eyebrow", text: `${m.name}${quiz.retry ? " · missed questions" : ""} · ${quiz.mode === "exam" ? "answers at end" : "practice"}` }),
      el("button", { class: "btn link", onclick: () => { quiz = null; view = "home"; render(); } }, "Quit")
    ),
    el("div", { class: "row spread" },
      el("h2", { text: `Question ${quiz.idx + 1} of ${n}` }),
      el("span", { class: "muted", text: `${answered} answered` })
    ),
    el("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(n), "aria-valuenow": String(answered) },
      el("i", { style: `width:${answered / n * 100}%` }))
  ));

  const opts = el("div", { class: "opts", role: "radiogroup", "aria-label": "Answer choices" });
  q.o.forEach((text, i) => {
    let cls = "opt";
    if (locked) { if (i === q.a) cls += " right"; else if (i === it.pick) cls += " wrong"; }
    else if (it.pick === i) cls += " sel";
    opts.append(el("button", { class: cls, role: "radio", "aria-checked": String(it.pick === i), disabled: locked,
      onclick: () => { it.pick = i; quiz.warn = false; render(); } },
      el("span", { class: "ltr", text: L[i] }),
      el("span", { class: "txt" + (isCode(text) ? " code" : ""), text })));
  });
  const card = el("div", { class: "card" }, el("p", { class: "qtext", text: q.q }), opts);
  if (locked) {
    const ok = it.pick === q.a;
    card.append(el("div", { class: "feedback " + (ok ? "good" : "bad") },
      ok ? "Correct." : `Not quite. The answer is ${L[q.a]}.`,
      q.n ? el("span", { class: "note", text: q.n }) : null));
  }
  app.append(card);

  const last = quiz.idx === n - 1;
  const unanswered = n - answered;
  app.append(el("div", { class: "nav" },
    el("button", { class: "btn", disabled: quiz.idx === 0, onclick: () => go(-1) }, "Back"),
    last
      ? el("button", { class: "btn primary", onclick: () => { if (unanswered && !quiz.warn) { quiz.warn = true; render(); } else finish(); } }, "Finish and see score")
      : el("button", { class: "btn primary", onclick: () => go(1) }, "Next")
  ));
  if (quiz.warn) {
    app.append(el("div", { class: "warnbox", role: "alert" },
      el("span", { text: `${unanswered} question${unanswered === 1 ? " is" : "s are"} unanswered and will count as wrong.` }),
      el("div", { class: "row" },
        el("button", { class: "btn primary", onclick: finish }, "Finish anyway"),
        el("button", { class: "btn", onclick: () => { quiz.idx = quiz.items.findIndex(x => x.pick === null); quiz.warn = false; render(); } }, "Go to first unanswered"))));
  }

  const dots = el("div", { class: "dots", "aria-label": "Jump to question" });
  quiz.items.forEach((x, i) => {
    let cls = "dot";
    if (quiz.mode === "practice" && x.pick !== null) cls += x.pick === m.qs[x.qi].a ? " r" : " w";
    else if (x.pick !== null) cls += " done";
    if (i === quiz.idx) cls += " cur";
    dots.append(el("button", { class: cls, "aria-label": `Question ${i + 1}`, onclick: () => { quiz.idx = i; render(); } }, String(i + 1)));
  });
  app.append(dots);
  app.append(el("p", { class: "muted keys" }, "Keys: ", el("kbd", { text: "A" }), "–", el("kbd", { text: "D" }), " pick an answer · ",
    el("kbd", { text: "Enter" }), " or ", el("kbd", { text: "→" }), " next · ", el("kbd", { text: "←" }), " back"));
}
function go(d) {
  const ni = quiz.idx + d;
  if (ni < 0 || ni >= quiz.items.length) return;
  quiz.idx = ni; quiz.warn = false; render();
}

function renderResults() {
  const m = modById(quiz.mod);
  const n = quiz.items.length;
  const missed = quiz.items.filter(it => it.pick !== m.qs[it.qi].a);
  const right = n - missed.length;
  const p = Math.round(right / n * 100);
  const s = stats[quiz.mod];
  const msg = p >= 93 ? "A-level work. You're ready for this quiz." :
              p >= 80 ? "Solid. Review the misses below, then retry them." :
              p >= 70 ? "Getting there. Go over the misses and reread those sections of the study guide." :
                        "Spend some time with the study guide, then try the missed questions again.";

  app.append(el("header", {},
    el("div", { class: "eyebrow", text: `${m.name} · ${m.ch}${quiz.retry ? " · missed questions" : ""}` }),
    el("h1", { text: "Your results" })));
  app.append(el("div", { class: "card" },
    el("div", { class: "score" },
      el("div", { class: "big", text: `${p}%` }),
      el("div", {},
        el("div", { class: "grade", text: `${right} of ${n} correct · ${grade(p)}` }),
        el("p", { class: "muted", text: msg }))),
    el("div", { class: "mod-stats" },
      pctChip(s.best, "Best"), el("span", { class: "chip", text: `${s.tries} attempt${s.tries === 1 ? "" : "s"} on this module` }),
      el("span", { class: "chip", text: "Grade uses the course scale" })),
    el("div", { class: "row" },
      missed.length ? el("button", { class: "btn primary", onclick: () => startQuiz(quiz.mod, missed.map(x => x.qi)) }, `Retry the ${missed.length} missed`) : null,
      el("button", { class: missed.length ? "btn" : "btn primary", onclick: () => { setup.len = setup.len; startQuiz(quiz.mod); } }, "New attempt"),
      el("button", { class: "btn", onclick: () => { quiz = null; view = "home"; openSetup = null; render(); window.scrollTo(0, 0); } }, "All modules"))
  ));

  app.append(el("div", { class: "row spread" },
    el("h2", { text: "Review" }),
    seg([["missed", `Missed (${missed.length})`], ["all", `All (${n})`]], reviewFilter, v => { reviewFilter = v; render(); })));
  const list = el("div", { class: "review" });
  quiz.items.forEach((it, i) => {
    const q = m.qs[it.qi];
    const ok = it.pick === q.a;
    if (reviewFilter === "missed" && ok) return;
    list.append(el("div", { class: "rv" + (ok ? "" : " miss") },
      el("div", { class: "q", text: `${i + 1}. ${q.q}` }),
      el("div", { class: "ans" },
        el("span", { class: "yours" + (ok ? "" : " bad"), text: it.pick === null ? "Your answer: none" : `Your answer: ${L[it.pick]}) ${q.o[it.pick]}` }),
        ok ? null : el("span", { class: "correct", text: `Correct: ${L[q.a]}) ${q.o[q.a]}` }),
        q.n ? el("span", { class: "muted", text: q.n }) : null)));
  });
  if (!list.children.length) list.append(el("p", { class: "muted", text: "No misses. Nice work." }));
  app.append(list);
}

function render() {
  app.replaceChildren();
  if (view === "quiz" && quiz) renderQuiz();
  else if (view === "results" && quiz) renderResults();
  else renderHome();
}
document.addEventListener("keydown", e => {
  if (view !== "quiz" || !quiz || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = quiz.items[quiz.idx];
  const k = e.key.toLowerCase();
  const i = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  const locked = quiz.mode === "practice" && it.pick !== null;
  if (i >= 0 && !locked) { it.pick = i; quiz.warn = false; render(); }
  else if (k === "arrowright" || k === "enter") { if (e.target.tagName === "BUTTON" && k === "enter") return; go(1); }
  else if (k === "arrowleft") go(-1);
});

function start(saved) {
  if (saved && saved.view) { view = saved.view; quiz = saved.quiz; setup = saved.setup || setup; openSetup = saved.openSetup ?? null; reviewFilter = saved.reviewFilter || reviewFilter; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ view, quiz, setup, openSetup, reviewFilter }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
